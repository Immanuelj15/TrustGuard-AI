  <text x="580" y="125" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">3. AI INFERENCE ENGINES</text>
  <text x="580" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Local Hugging Face + Hybrid Rules</text>

