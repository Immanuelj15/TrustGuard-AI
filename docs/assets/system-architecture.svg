  <rect x="835" y="100" width="225" height="40" rx="12" fill="#1e293b"/>
  <text x="850" y="125" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">4. PERSISTENCE &amp; DATA</text>
  <text x="850" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Dual Relational + Object Stores</text>

  <g transform="translate(850, 175)">
    <!-- Relational DB -->
    <rect width="195" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">SQLAlchemy 2.0 ORM</text>
    <text x="12" y="40" fill="#38bdf8" font-family="sans-serif" font-size="10">PostgreSQL (Production)</text>
    <text x="12" y="56" fill="#94a3b8" font-family="sans-serif" font-size="10">SQLite (Zero-config local dev)</text>
    <text x="12" y="72" fill="#64748b" font-family="sans-serif" font-size="9">Cases, Evidence, Notes, Audits</text>

    <!-- Blob Storage -->
    <rect y="92" width="195" height="74" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="114" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Object Storage</text>
    <text x="12" y="132" fill="#38bdf8" font-family="sans-serif" font-size="10">MinIO (S3-compatible API)</text>
    <text x="12" y="148" fill="#94a3b8" font-family="sans-serif" font-size="10">Local Filesystem Adapter</text>
    <text x="12" y="160" fill="#64748b" font-family="sans-serif" font-size="9">Encapsulated evidence blobs</text>

    <!-- Synthetic Dataset Gallery -->
    <rect y="178" width="195" height="85" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="12" y="200" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Synthetic Test Gallery</text>
    <text x="12" y="218" fill="#94a3b8" font-family="sans-serif" font-size="10">530 Curated Samples:</text>
    <text x="12" y="232" fill="#64748b" font-family="sans-serif" font-size="9">500 Text, 21 Audio, 6 Video,</text>
    <text x="12" y="244" fill="#64748b" font-family="sans-serif" font-size="9">3 Multimodal Pairs</text>
    <text x="12" y="256" fill="#34d399" font-family="sans-serif" font-size="8" font-weight="600">Zero Privacy Risk / Offline</text>

    <!-- Audit Log -->
    <rect y="275" width="195" height="60" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="12" y="297" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Immutable Audit Logs</text>
    <text x="12" y="315" fill="#94a3b8" font-family="sans-serif" font-size="10">Cryptographic action timeline</text>
    <text x="12" y="327" fill="#64748b" font-family="sans-serif" font-size="9">Redacted query payloads</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.75">
    <!-- P1 to P2 -->
    <path d="M 265 200 L 295 200" marker-end="url(#arrow)"/>
    <path d="M 265 270 L 295 270" marker-end="url(#arrow)"/>
    <path d="M 265 370 L 295 370" marker-end="url(#arrow)"/>

    <!-- P2 to P3 -->
    <path d="M 535 220 L 565 220" marker-end="url(#arrow)"/>
    <path d="M 535 320 L 565 320" marker-end="url(#arrow)"/>
    <path d="M 535 480 L 565 480" marker-end="url(#arrow)"/>

    <!-- P2 to P4 -->
    <path d="M 505 280 C 530 280, 545 42, 800 42 C 820 42, 835 150, 835 210" stroke-dasharray="4,4" opacity="0.3"/>
    <path d="M 810 215 L 835 215" marker-end="url(#arrow)"/>
    <path d="M 810 320 L 835 320" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

</svg>
