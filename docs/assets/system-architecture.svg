    <!-- Text BERT -->
    <rect width="215" height="66" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
    <text x="12" y="20" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">BERT Text Classifier</text>
    <text x="12" y="36" fill="#94a3b8" font-family="sans-serif" font-size="10">mrm8488/bert-tiny-finetuned-sms</text>
    <text x="12" y="50" fill="#64748b" font-family="sans-serif" font-size="9">+ Rule Engine: Digital Arrest / Extortion</text>
    <text x="12" y="60" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">Local Hugging Face (CPU/CUDA)</text>

    <!-- Audio Whisper -->
    <rect y="78" width="215" height="66" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="12" y="98" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Whisper ASR Speech-to-Text</text>
    <text x="12" y="114" fill="#94a3b8" font-family="sans-serif" font-size="10">openai/whisper-tiny</text>
    <text x="12" y="128" fill="#64748b" font-family="sans-serif" font-size="9">Verbatim audio call transcription</text>
    <text x="12" y="138" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">Local Pure-Python Pipeline</text>

    <!-- Acoustic Telemetry -->
    <rect y="156" width="215" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="176" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Acoustic Signal Telemetry</text>
    <text x="12" y="192" fill="#94a3b8" font-family="sans-serif" font-size="10">scipy &amp; numpy feature extraction</text>
    <text x="12" y="204" fill="#64748b" font-family="sans-serif" font-size="9">Spectral centroid, SNR, zero-crossing</text>

    <!-- Video Frame Heuristics -->
    <rect y="226" width="215" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="246" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Video Container Telemetry</text>
    <text x="12" y="262" fill="#94a3b8" font-family="sans-serif" font-size="10">OpenCV stream metadata &amp; face cues</text>
    <text x="12" y="274" fill="#eab308" font-family="sans-serif" font-size="9">Transparent diagnostic limitations</text>

    <!-- OpenRouter LLM Layer -->
    <rect y="296" width="215" height="80" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="12" y="316" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">OpenRouter Cloud LLM</text>
    <text x="12" y="332" fill="#94a3b8" font-family="sans-serif" font-size="10">meta-llama/llama-3.3-70b-instruct</text>
    <text x="12" y="346" fill="#c084fc" font-family="sans-serif" font-size="9">PII Sanitized + Explicit Investigator Consent</text>
    <text x="12" y="360" fill="#64748b" font-family="sans-serif" font-size="9">Explainable reasoning &amp; tactic summary</text>
    <text x="12" y="370" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="600">Optional Cloud Integration</text>
  </g>

  <!-- LAYER 4: DATA & STORAGE (RIGHT COLUMN) -->
