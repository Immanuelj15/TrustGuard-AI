<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0e172e"/>
    </linearGradient>
    <linearGradient id="aiCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f36"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
    <marker id="aiArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="1100" height="520" fill="url(#aiBg)"/>

  <!-- Title -->
  <text x="50" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">TrustGuard AI — Multi-Modal AI &amp; Analytical Pipeline</text>
  <text x="50" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Decoupled hybrid pipeline combining local neural inference, digital signal processing, and private LLM reasoning</text>

  <!-- COLUMN 1: INPUT MODALITIES -->
  <g transform="translate(40, 100)">
    <rect width="170" height="380" rx="10" fill="url(#aiCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="170" height="32" rx="10" fill="#1e293b"/>
    <text x="14" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">INPUT EVIDENCE</text>

    <!-- Text input box -->
    <rect x="14" y="50" width="142" height="70" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
    <text x="22" y="72" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700">Text Artifacts</text>
    <text x="22" y="88" fill="#94a3b8" font-family="sans-serif" font-size="9">SMS, WhatsApp, Email,</text>
    <text x="22" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9">Notices, Extortion alerts</text>

    <!-- Audio input box -->
    <rect x="14" y="140" width="142" height="70" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="22" y="162" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Audio Telemetry</text>
    <text x="22" y="178" fill="#94a3b8" font-family="sans-serif" font-size="9">WAV / MP3 recordings,</text>
    <text x="22" y="192" fill="#94a3b8" font-family="sans-serif" font-size="9">VoIP calls, Voice notes</text>

    <!-- Video input box -->
    <rect x="14" y="230" width="142" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="22" y="252" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Video Artifacts</text>
    <text x="22" y="268" fill="#94a3b8" font-family="sans-serif" font-size="9">MP4 container, video call</text>

    <!-- Caller intel box -->
    <rect x="14" y="305" width="142" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="22" y="325" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Caller Telephony</text>
    <text x="22" y="340" fill="#94a3b8" font-family="sans-serif" font-size="9">Phone numbers (E.164)</text>
  </g>

  <!-- COLUMN 2: LOCAL NEURAL & SIGNAL PROCESSING -->
  <g transform="translate(250, 100)">
    <rect width="280" height="380" rx="10" fill="url(#aiCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="280" height="32" rx="10" fill="#1e293b"/>
    <text x="14" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">TIER 1: LOCAL INFERENCE &amp; TELEMETRY</text>

    <!-- BERT Transformer Box -->
    <rect x="14" y="45" width="252" height="85" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
    <text x="22" y="66" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">BERT Transformer Classifier</text>
    <text x="22" y="82" fill="#38bdf8" font-family="sans-serif" font-size="9">mrm8488/bert-tiny-finetuned-sms-spam</text>
    <text x="22" y="96" fill="#94a3b8" font-family="sans-serif" font-size="9">• Binary sequence classification (Spam / Ham)</text>
    <text x="22" y="110" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">✓ Real Local HF Inference (PyTorch CPU/CUDA)</text>

    <!-- Whisper Box -->
    <rect x="14" y="140" width="252" height="85" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="22" y="161" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Whisper ASR Speech-to-Text</text>
    <text x="22" y="177" fill="#38bdf8" font-family="sans-serif" font-size="9">openai/whisper-tiny</text>
    <text x="22" y="191" fill="#94a3b8" font-family="sans-serif" font-size="9">• Pure-Python WAV speech decoding</text>
    <text x="22" y="205" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">✓ Real Local HF Model Execution</text>

    <!-- Signal Processing Box -->
    <rect x="14" y="235" width="252" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="22" y="254" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Acoustic Signal Processing (SciPy)</text>
    <text x="22" y="270" fill="#94a3b8" font-family="sans-serif" font-size="9">• Spectral centroid, ZCR, SNR, Flatness</text>
    <text x="22" y="284" fill="#94a3b8" font-family="sans-serif" font-size="9">• Anomaly baseline for synthetic speech</text>

    <!-- Video container check -->
    <rect x="14" y="310" width="252" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="22" y="328" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Container &amp; Visual Telemetry</text>
    <text x="22" y="344" fill="#94a3b8" font-family="sans-serif" font-size="9">• OpenCV codec inspection &amp; face stability</text>
  </g>

  <!-- COLUMN 3: HEURISTIC DOMAIN RULE ENGINE -->
  <g transform="translate(565, 100)">
    <rect width="245" height="380" rx="10" fill="url(#aiCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="245" height="32" rx="10" fill="#1e293b"/>
    <text x="14" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">TIER 2: CYBERCRIME HEURISTICS</text>

    <rect x="14" y="45" width="217" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="22" y="66" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Pattern &amp; Tactic Engine</text>
    <text x="22" y="86" fill="#cbd5e1" font-family="sans-serif" font-size="10">1. Authority Impersonation</text>
    <text x="32" y="100" fill="#64748b" font-family="sans-serif" font-size="9">CBI, ED, Police, Supreme Court</text>
    <text x="22" y="116" fill="#cbd5e1" font-family="sans-serif" font-size="10">2. Financial Coercion</text>
    <text x="32" y="130" fill="#64748b" font-family="sans-serif" font-size="9">Asset freezing, RTGS/IMPS transfer</text>
    <text x="22" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="10">3. Malicious Artifacts</text>
    <text x="32" y="160" fill="#64748b" font-family="sans-serif" font-size="9">APK download, OTP harvest, SMS link</text>
    <text x="22" y="176" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">English + Hindi + Tamil keywords</text>

    <!-- Dynamic Ensemble Box -->
    <rect x="14" y="210" width="217" height="150" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="22" y="232" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700">Ensemble Risk Synthesizer</text>
    <text x="22" y="250" fill="#94a3b8" font-family="sans-serif" font-size="9">• Combines BERT logits + rule indicators</text>
    <text x="22" y="266" fill="#94a3b8" font-family="sans-serif" font-size="9">• Whisper transcript fed into text engine</text>
    <text x="22" y="286" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="700">Composite Risk (0-100)</text>
    <text x="22" y="304" fill="#34d399" font-family="sans-serif" font-size="9">Low &lt;30 | Med 30-65 | High 65-85 | Crit &gt;85</text>
    <text x="22" y="324" fill="#a7f3d0" font-family="sans-serif" font-size="9" font-weight="600">✓ Deterministic &amp; Auditable</text>
  </g>

  <!-- COLUMN 4: CLOUD REASONING LAYER -->
  <g transform="translate(845, 100)">
    <rect width="215" height="380" rx="10" fill="url(#aiCard)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="215" height="32" rx="10" fill="#1e293b"/>
    <text x="14" y="21" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">TIER 3: REASONING &amp; LLM</text>

    <rect x="14" y="45" width="187" height="90" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="20" y="66" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">OpenRouter Integration</text>
    <text x="20" y="82" fill="#a855f7" font-family="sans-serif" font-size="9">meta-llama/llama-3.3-70b</text>
    <text x="20" y="98" fill="#94a3b8" font-family="sans-serif" font-size="9">• Consent verification modal</text>
    <text x="20" y="112" fill="#94a3b8" font-family="sans-serif" font-size="9">• Zero raw media transmitted</text>
    <text x="20" y="126" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="600">Strict PII Redaction Engine</text>

    <!-- Output Box -->
    <rect x="14" y="148" width="187" height="135" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="168" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">Investigator Guidance</text>
    <text x="20" y="186" fill="#94a3b8" font-family="sans-serif" font-size="9">• Social engineering tactics</text>
    <text x="20" y="200" fill="#94a3b8" font-family="sans-serif" font-size="9">• Plain-language summary</text>
    <text x="20" y="214" fill="#94a3b8" font-family="sans-serif" font-size="9">• Recommended next steps</text>
    <text x="20" y="232" fill="#eab308" font-family="sans-serif" font-size="9">• Preserves investigator notes</text>
    <text x="20" y="250" fill="#64748b" font-family="sans-serif" font-size="8">Never replaces human verdict</text>

    <!-- Report compile -->
    <rect x="14" y="295" width="187" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="315" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">PDF Forensic Dossier</text>
    <text x="20" y="331" fill="#94a3b8" font-family="sans-serif" font-size="9">ReportLab compiled dossier</text>
    <text x="20" y="345" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="600">Includes SHA-256 &amp; Sign-off</text>
  </g>

  <!-- Connective Arrows -->
  <path d="M 210 120 L 250 85" stroke="#06b6d4" stroke-width="1.8" fill="none" marker-end="url(#aiArrow)"/>
  <path d="M 210 175 L 250 180" stroke="#06b6d4" stroke-width="1.8" fill="none" marker-end="url(#aiArrow)"/>
  <path d="M 210 260 L 250 335" stroke="#06b6d4" stroke-width="1.8" fill="none" marker-end="url(#aiArrow)"/>
  
  <!-- Whisper to Text Scam Engine arrow -->
  <path d="M 502 180 C 530 180, 540 120, 565 120" stroke="#34d399" stroke-width="1.8" stroke-dasharray="3,3" fill="none" marker-end="url(#aiArrow)"/>

  <!-- T1 to T2 -->
  <path d="M 502 90 L 565 90" stroke="#06b6d4" stroke-width="1.8" fill="none" marker-end="url(#aiArrow)"/>
  <path d="M 502 270 L 565 270" stroke="#06b6d4" stroke-width="1.8" fill="none" marker-end="url(#aiArrow)"/>

  <!-- T2 to T3 -->
  <path d="M 810 280 L 845 220" stroke="#a855f7" stroke-width="1.8" fill="none" marker-end="url(#purpleArrow)"/>
  <path d="M 810 280 L 845 320" stroke="#10b981" stroke-width="1.8" fill="none" marker-end="url(#aiArrow)"/>

</svg>
